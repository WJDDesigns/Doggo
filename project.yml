name: Doggo
options:
  bundleIdPrefix: com.wjddesigns
  deploymentTarget:
    iOS: "17.0"
targets:
  Doggo:
    type: application
    platform: iOS
    sources: [Doggo]
    info:
      path: Doggo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Doggo
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Shows where you are relative to your dogs.
        NSBluetoothAlwaysUsageDescription: Talks to your dog's collar and beacons over Bluetooth.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjddesigns.doggo
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
